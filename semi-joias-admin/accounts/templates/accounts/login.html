<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Carol Semijoias</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111;
      color: #e0e0e0;
      font-family: 'Segoe UI', sans-serif;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .card {
      background: #161616;
      border: 1px solid #1f1f1f;
      border-radius: 6px;
      padding: 40px 36px;
      width: 100%;
      max-width: 360px;
    }

    .card-title {
      font-size: 20px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 4px;
    }

    .card-sub {
      font-size: 12px;
      color: #555;
      margin-bottom: 28px;
    }

    .field { margin-bottom: 16px; }

    label {
      display: block;
      font-size: 12px;
      color: #888;
      margin-bottom: 6px;
      letter-spacing: .04em;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 4px;
      color: #e0e0e0;
      font-size: 14px;
      padding: 9px 12px;
      outline: none;
      transition: border-color .15s;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: #555;
    }

    .btn {
      display: block;
      width: 100%;
      margin-top: 24px;
      padding: 10px;
      background: #fff;
      color: #111;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background .12s;
    }

    .btn:hover { background: #ddd; }

    .errors {
      background: #3d0000;
      color: #ff8888;
      border: 1px solid #ff0000;
      border-radius: 4px;
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <p class="card-title">Carol Semijoias</p>
    <p class="card-sub">Sistema de gestão — acesso restrito</p>

    {% if form.errors %}
      <div class="errors">Usuário ou senha inválidos.</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="field">
        <label for="id_username">Usuário</label>
        {{ form.username }}
      </div>
      <div class="field">
        <label for="id_password">Senha</label>
        {{ form.password }}
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn">Entrar</button>
    </form>
  </div>
</body>
</html>
